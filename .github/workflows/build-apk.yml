# Builds the app in the cloud, so you don't need Android Studio.
# Push this folder to a GitHub repository; every push to main produces a release with the APK.
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   YOUTUBE_API_KEY                         official YouTube search (otherwise key-less search is used)
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD,
#   KEY_ALIAS, KEY_PASSWORD                 sign every build with the same key, so updates install
#                                           over the old version without uninstalling it first
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub's default machine (Ubuntu 24.04 or 26.04 during the 2026 switch). The SDK step below
    # works on either: it downloads Google's Android tools if a machine doesn't have them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's runner usually has the Android SDK already; if an image ever doesn't, the official
      # command-line tools are downloaded from Google. Then: accept licenses, add what the app needs.
      # (The old android-actions/setup-android action fails on the removed "tools" package.)
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ ! -x "$SDKM" ]; then
            echo "No Android SDK on this runner image: downloading the command-line tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSfL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/clt"
            mv "$RUNNER_TEMP/clt/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Optional settings from secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" >> local.properties; fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk KaraokeNight.apk

      - uses: actions/upload-artifact@v6
        with:
          name: KaraokeNight-apk
          path: KaraokeNight.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Karaoke Night build ${{ github.run_number }}
          files: KaraokeNight.apk
