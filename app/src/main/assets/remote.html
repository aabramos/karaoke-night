<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0614">
<title>Karaoke Night</title>
<style>
:root{--bg:#0b0614;--card:#1c1233;--card2:#261946;--pink:#ff3da5;--cyan:#2ee6ff;--gold:#ffd23f;--dim:#b9aedb;--line:#3a2a63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 60% at 50% 0,#3a1a5e 0,#170c2b 55%,var(--bg) 100%) fixed;color:#fff;font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 16px 90px;min-height:100vh}
h1{margin:4px 0 14px;font-size:26px;font-weight:900;letter-spacing:.06em;text-shadow:0 0 18px var(--pink)}
h1 span{color:var(--cyan);text-shadow:0 0 18px var(--cyan)}
h2{font-size:13px;letter-spacing:.2em;color:var(--cyan);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.now{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#3b1450,#1c1233);border-color:#6b2a7f}
.now .mic{font-size:30px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.now b{display:block;font-size:18px;color:var(--gold)}
.now small{color:var(--dim)}
input{-webkit-appearance:none;appearance:none;width:100%;background:var(--card2);border:2px solid var(--line);color:#fff;border-radius:999px;padding:12px 18px;font-size:16px;outline:none}
input:focus{border-color:var(--cyan)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.partner{margin-top:8px}
.row{display:flex;gap:8px}
.btn{border:0;border-radius:999px;background:var(--pink);color:#fff;font-weight:800;padding:0 18px;font-size:16px;min-height:46px}
.btn:active{transform:scale(.96)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:999px;padding:10px 14px;font-size:14px;min-height:40px}
.res{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;background:var(--card);margin-top:8px;border:1px solid var(--line)}
.res img{width:112px;height:63px;object-fit:cover;border-radius:10px;flex:none;background:#120a22}
.res .t{flex:1;min-width:0}
.res .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
.res .t small{color:var(--cyan);font-size:12px}
.add{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:26px;font-weight:900}
.add.done{background:#2b8a4b}
.q{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.q:last-child{border:0}
.n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;color:#0b0614}
.q .t{min-width:0;flex:1}
.q .rm{flex:none;min-width:44px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:#fff;font-weight:800;font-size:14px;padding:0 12px}
.q .rm.sure{background:#ff5a6e;border-color:#ff5a6e}
.qhint{color:var(--dim);font-size:12px;text-align:center;padding:8px 4px 0}
.q .t b{display:block}
.q .t small{display:block;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{background:rgba(255,61,165,.12);border-radius:10px}
.muted{color:var(--dim);text-align:center;padding:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#fff;color:#0b0614;font-weight:800;padding:12px 20px;border-radius:999px;transition:transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.players{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 0}
.players .chip.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.phint{color:var(--dim);font-size:13px;padding:6px 4px 0}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
/* tonight's top 3: 1st in the middle, raised; the page order stays 1, 2, 3 for screen readers */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;min-width:0}
.pod.p1{order:2;padding:14px 6px 12px;border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,63,.22)}
.pod.p2{order:1}.pod.p3{order:3}
.pod .m{font-size:22px;line-height:1}
.pod .av{width:34px;height:34px;border-radius:50%;margin:6px auto 4px;display:grid;place-items:center;font-weight:900;color:#0b0614}
.pod.p1 .av{width:44px;height:44px;font-size:20px}
.pod b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .s{color:var(--gold);font-weight:900;font-size:20px;line-height:1.2}
.toplist{margin-top:8px;border-radius:12px;overflow:hidden}
.toplist .tr{display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:13px;background:rgba(255,255,255,.06)}
.toplist .tr:nth-child(odd){background:rgba(255,255,255,.1)}
.toplist .tr b{flex:none;max-width:35%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toplist .tr span{flex:1;min-width:0;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toplist .tr i{font-style:normal;color:var(--gold);font-weight:900}
.pod.p1 .s{font-size:26px}
.pod.open{border-style:dashed;opacity:.6}
.pod.open .av{background:var(--card2);color:var(--dim)}
.pod.me{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.pod .you{display:inline-block;margin-top:3px;font-size:10px;font-weight:900;letter-spacing:.1em;color:#0b0614;background:var(--cyan);border-radius:999px;padding:1px 7px}
.pod.lead{animation:lead 1.2s ease-out}
@keyframes lead{0%{transform:scale(.85)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.topnote{margin-top:8px;font-size:13px;color:var(--dim);text-align:center}
.btn:focus-visible,.chip:focus-visible,.add:focus-visible,.rm:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.now .mic,.pod.lead{animation:none}#toast{transition:none}.btn:active{transform:none}}
.spin{display:inline-block;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>🎤 KARAOKE <span>NIGHT</span></h1>

<div class="card now" id="now"><div class="mic">🎤</div><div><b id="nowSinger">Waiting for the first singer…</b><small id="nowSong">Add a song below!</small></div></div>

<h2 id="topTitle">🏆 TONIGHT'S TOP 3</h2>
<div id="top"><div class="muted">Loading…</div></div>

<h2>YOUR NAME</h2>
<input id="name" maxlength="20" placeholder="Who's singing?" autocomplete="nickname" aria-label="Your name">
<input id="partner" class="partner" maxlength="20" placeholder="👫 Duet partner (optional)" autocomplete="off" aria-label="Duet partner, optional">
<div class="players" id="players"></div>
<div class="phint" id="phint" hidden></div>

<h2 id="findTitle">FIND A SONG</h2>
<form class="row" id="sf"><input id="q" type="search" maxlength="80" placeholder="Song or artist…" enterkeyhint="search" aria-label="Search a song or artist"><button class="btn">Go</button></form>
<div class="chips" id="chips"></div>
<div id="results"></div>

<h2>UP NEXT</h2>
<div class="card" id="queue"><div class="muted">The queue is empty.</div></div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  var K = new URLSearchParams(location.search).get('k') || '';
  var ID = /^[A-Za-z0-9_-]{11}$/;
  var COLORS = ['#ff3da5','#2ee6ff','#ffd23f','#7cff6b','#b36bff','#ff8a3d'];
  var $ = function(id){ return document.getElementById(id); };
  var nameEl = $('name');
  try { nameEl.value = localStorage.getItem('singer') || ''; } catch(e) {}
  nameEl.addEventListener('input', function(){ try { localStorage.setItem('singer', nameEl.value.trim()); } catch(e) {} });

  // ---- registered players: tap a name to fill the box being typed in ----
  // Only the TV can remove players. With many players, the most recent ones show first and
  // typing filters the list, so it never becomes a wall of names.
  var partnerEl = $('partner');
  var target = nameEl;                       // the box a tapped name goes into: the last one used
  var players = [], playersKey = '';
  var SHOWN = 12;
  nameEl.addEventListener('focus', function(){ target = nameEl; renderPlayers(); });
  partnerEl.addEventListener('focus', function(){ target = partnerEl; renderPlayers(); });

  function renderPlayers(){
    var box = $('players'); box.textContent = '';
    var typed = target.value.trim().toLowerCase();
    var chosen = [nameEl.value.trim().toLowerCase(), partnerEl.value.trim().toLowerCase()];
    var list = players;
    var exact = players.some(function(p){ return p.toLowerCase() === typed; });
    if (typed && !exact) {
      // typing: names that start with it first, then names that contain it
      var starts = players.filter(function(p){ return p.toLowerCase().indexOf(typed) === 0; });
      var has = players.filter(function(p){ var i = p.toLowerCase().indexOf(typed); return i > 0; });
      list = starts.concat(has);
    }
    list.slice(0, SHOWN).forEach(function(name){
      var c = el('button', 'chip', name);
      c.type = 'button';
      if (chosen.indexOf(name.toLowerCase()) >= 0) { c.classList.add('on'); c.setAttribute('aria-pressed','true'); }
      c.onclick = function(){
        target.value = name;
        if (target === nameEl) { try { localStorage.setItem('singer', name); } catch(e) {} }
        renderPlayers();
      };
      box.appendChild(c);
    });
    var hint = $('phint');
    hint.hidden = players.length === 0;
    hint.textContent = typed && !list.length ? 'New singer? Just type your name.'
      : list.length > SHOWN ? 'Tap a name to fill the box above · type to find more (' + players.length + ' players)'
      : 'Tap a name to fill the box above';
  }
  partnerEl.addEventListener('input', renderPlayers);
  nameEl.addEventListener('input', renderPlayers);

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function color(s){ var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return COLORS[Math.abs(h) % COLORS.length]; }
  var tt;
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 2600); }

  function api(path, opts){
    var sep = path.indexOf('?') < 0 ? '?' : '&';
    return fetch(path + sep + 'k=' + encodeURIComponent(K), opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; });
    });
  }

  // ---- quick picks: the same as on the TV, for the party's country ----
  var region = null;
  var recent = [];     // the last songs sung on the TV, from /api/state
  var searchGen = 0;   // bumped by each search, so a slow answer can't replace newer results
  var lastFrom = '';   // the search or quick pick the shown songs came from
  function setPicks(list){
    var box = $('chips'); box.textContent = '';
    var pc = el('button','chip','🕘 Played'); pc.onclick = showPlayed; box.appendChild(pc);
    (list || []).forEach(function(p){
      if (!p || typeof p[0] !== 'string' || typeof p[1] !== 'string') return;
      var c = el('button','chip',p[0]); c.onclick = function(){ $('q').value = p[1]; search(p[1]); }; box.appendChild(c);
    });
  }
  setPicks([['🔥 Top hits','top hits'],['🕺 80s','80s hits'],['📼 90s','90s hits'],['🎸 Rock','rock classics'],['👫 Duets','duets'],['💔 Ballads','love ballads'],['🍻 Party','party songs']]);

  $('sf').onsubmit = function(e){ e.preventDefault(); var q = $('q').value.trim(); if (q) { $('q').blur(); search(q); } };

  function search(q){
    var box = $('results'); box.textContent = '';
    box.appendChild(el('div','muted')).innerHTML = '<span class="spin">🎵</span> Searching…';
    var mine = ++searchGen;
    lastFrom = q;                                  // sent with the song: it helps the TV tell the genre
    api('/api/search?q=' + encodeURIComponent(q)).then(function(list){
      if (mine !== searchGen) return;   // a newer search or the Played list took over
      showSongs(list, 'No karaoke versions found. Try another song.');
    }).catch(function(e){ if (mine !== searchGen) return; box.textContent = ''; box.appendChild(el('div','muted',e.message)); });
  }

  // "🕘 Played": the last songs sung tonight, to sing again with one tap
  function showPlayed(){
    searchGen++; lastFrom = '';
    showSongs(recent, 'Nothing has been sung yet. Songs show up here after they play.');
  }

  function showSongs(list, emptyText){
      var box = $('results'); box.textContent = '';
      if (!list.length) { box.appendChild(el('div','muted',emptyText)); return; }
      list.forEach(function(v){
        if (!ID.test(v.id)) return;
        var r = el('div','res');
        var img = el('img'); img.loading = 'lazy'; img.alt = ''; img.onerror = function(){ this.style.visibility = 'hidden'; }; img.src = 'https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg';
        var t = el('div','t'); t.appendChild(el('b',null,v.title)); t.appendChild(el('small',null,[v.channel, v.dur, v.views].filter(function(x){ return x; }).join(' · ')));
        var b = el('button','add','+'); b.setAttribute('aria-label','Add ' + v.title + ' to the queue');
        b.onclick = function(){ add(v, b); };
        r.appendChild(img); r.appendChild(t); r.appendChild(b); box.appendChild(r);
      });
  }

  function add(v, btn){
    var singer = nameEl.value.trim();
    var partner = $('partner').value.trim();
    if (!singer) { toast('Type your name first 👆'); nameEl.focus(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    btn.disabled = true;
    api('/api/add', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'id=' + encodeURIComponent(v.id) + '&singer=' + encodeURIComponent(singer) + '&partner=' + encodeURIComponent(partner) +
        '&phone=' + PHONE + '&from=' + encodeURIComponent(lastFrom.slice(0, 80)) })
      .then(function(r){
        if (r && typeof r.key === 'number') rememberMine(r.key);
        btn.textContent = '✓'; btn.classList.add('done');
        toast('🎉 Added! Get ready, ' + singer + (partner ? ' & ' + partner : '') + '!');
        $('partner').value = '';   // the next song is a solo unless a partner is typed again
        refresh(); })
      .catch(function(e){ btn.disabled = false; toast(e.message); });
  }

  // ---- songs added by mistake: this phone can take its own waiting songs back out ----
  // A random ID for this phone (kept on the phone). The TV only lets the phone that added a song remove it.
  var PHONE = (function(){
    var id = null;
    try { id = localStorage.getItem('phone'); } catch(e) {}
    if (!id || !/^[A-Za-z0-9]{24}$/.test(id)) {
      var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', b = new Uint8Array(24); id = '';
      (window.crypto || window.msCrypto).getRandomValues(b);
      for (var i = 0; i < 24; i++) id += abc.charAt(b[i] % abc.length);
      try { localStorage.setItem('phone', id); } catch(e) {}
    }
    return id;
  })();
  var mine = [];                             // keys of the songs this phone added (kept on the phone)
  try { mine = JSON.parse(localStorage.getItem('mine') || '[]').filter(function(k){ return typeof k === 'number'; }); } catch(e) {}
  function rememberMine(key){
    mine = mine.filter(function(k){ return k !== key; }).concat([key]).slice(-30);
    try { localStorage.setItem('mine', JSON.stringify(mine)); } catch(e) {}
  }
  var queueNow = [], sureKey = null, sureTimer = null;

  // ✕ asks "Remove?" first; a second tap within a few seconds removes the song
  function renderQueue(){
    var q = $('queue'); q.textContent = '';
    if (!queueNow.length) { q.appendChild(el('div','muted','The queue is empty. Be the first! 🎤')); return; }
    var me = nameEl.value.trim().toLowerCase(), anyMine = false;
    queueNow.forEach(function(it, i){
      var row = el('div','q' + (me && it.singer.toLowerCase() === me ? ' me' : ''));
      var n = el('div','n', String(i + 1)); n.style.background = color(it.singer);
      var t = el('div','t'); t.appendChild(el('b',null,it.singer)); t.appendChild(el('small',null,it.title));
      row.appendChild(n); row.appendChild(t);
      if (typeof it.k === 'number' && mine.indexOf(it.k) >= 0) {
        anyMine = true;
        var sure = sureKey === it.k;
        var b = el('button','rm' + (sure ? ' sure' : ''), sure ? 'Remove?' : '✕'); b.type = 'button';
        b.setAttribute('aria-label', sure ? 'Tap again to remove ' + it.title : 'Remove ' + it.title + ' from the queue');
        b.onclick = function(){ if (sureKey === it.k) removeSong(it, b); else askRemove(it.k); };
        row.appendChild(b);
      }
      q.appendChild(row);
    });
    if (anyMine) q.appendChild(el('div','qhint','Added a song by mistake? Tap ✕ next to it. Only songs from this phone can be removed.'));
  }
  function askRemove(key){
    sureKey = key; clearTimeout(sureTimer);
    sureTimer = setTimeout(function(){ sureKey = null; renderQueue(); }, 4000);
    renderQueue();
  }
  function removeSong(it, b){
    b.disabled = true; clearTimeout(sureTimer); sureKey = null;
    api('/api/remove', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'key=' + encodeURIComponent(it.k) + '&phone=' + PHONE })
      .then(function(){
        toast('🗑 Removed “' + it.title.slice(0, 40) + '”');
        mine = mine.filter(function(k){ return k !== it.k; });
        try { localStorage.setItem('mine', JSON.stringify(mine)); } catch(e) {}
        queueNow = queueNow.filter(function(x){ return x.k !== it.k; }); renderQueue();
        refresh();
      })
      .catch(function(e){ toast(e.message); renderQueue(); });
  }

  // ---- tonight's top 3 (best score per singer), with the best duet underneath ----
  var top = [], duetBest = null, topKey = null, leader = null;
  function renderTop(){
    var box = $('top'); box.textContent = '';
    if (!top.length) {
      box.appendChild(el('div','muted','No scores yet tonight. The first song takes the crown 👑'));
      return;
    }
    var me = nameEl.value.trim().toLowerCase();
    var medals = ['🥇','🥈','🥉'], places = ['1st','2nd','3rd'];
    var pod = el('div','podium');
    for (var i = 0; i < 3; i++) {
      var p = top[i];
      var c = el('div','pod p' + (i + 1));
      c.appendChild(el('div','m', medals[i])).setAttribute('aria-hidden','true');
      if (p) {
        var mine = me && p.name.toLowerCase() === me;
        if (mine) c.classList.add('me');
        if (i === 0 && p.name === leader && topKey !== null && justLed) c.classList.add('lead');
        var av = el('div','av', p.name.charAt(0).toUpperCase()); av.style.background = color(p.name); av.setAttribute('aria-hidden','true');
        c.appendChild(av); c.appendChild(el('b',null,p.name)); c.appendChild(el('div','s',String(p.score)));
        if (mine) c.appendChild(el('span','you','YOU'));
        c.setAttribute('aria-label', places[i] + ' place: ' + p.name + (mine ? ' (you)' : '') + ', ' + p.score + ' points' + (p.song ? ', singing ' + p.song : ''));
      } else {
        c.classList.add('open');
        var q = el('div','av','?'); q.setAttribute('aria-hidden','true'); c.appendChild(q);
        c.appendChild(el('b',null,'Your spot?')); c.appendChild(el('div','s','–'));
        c.setAttribute('aria-label', places[i] + ' place: still free');
      }
      c.setAttribute('role','listitem');
      pod.appendChild(c);
    }
    pod.setAttribute('role','list');
    box.appendChild(pod);
    // The same places as a list, with the song each score came from
    var list = el('div','toplist');
    top.forEach(function(p, i){
      var r = el('div','tr');
      r.appendChild(el('span',null,medals[i])).style.flex = 'none';
      r.appendChild(el('b',null,p.name));
      r.appendChild(el('span',null,p.song || ''));
      r.appendChild(el('i',null,String(p.score)));
      list.appendChild(r);
    });
    list.setAttribute('aria-hidden','true');   // the podium above already reads out each place and song
    box.appendChild(list);
    if (duetBest) box.appendChild(el('div','topnote','👫 Best duet: ' + duetBest.name + ' · ' + duetBest.score + (duetBest.song ? ' · ' + duetBest.song : '')));
  }
  var justLed = false;
  function setTop(list, duet){
    var key = JSON.stringify([list, duet]);
    if (key === topKey) return;
    var first = topKey === null;
    var newLeader = list.length ? list[0].name : null;
    justLed = !first && newLeader !== null && newLeader !== leader;
    if (justLed) {
      var me = nameEl.value.trim().toLowerCase();
      toast(newLeader.toLowerCase() === me ? '👑 You\'re #1 tonight!' : '👑 ' + newLeader + ' takes the lead with ' + list[0].score + '!');
    }
    top = list; duetBest = duet; leader = newLeader; topKey = key;
    renderTop();
  }
  nameEl.addEventListener('input', function(){ if (topKey !== null) { justLed = false; renderTop(); } });

  function refresh(){
    return api('/api/state').then(function(s){
      failures = 0;
      var list = Array.isArray(s.players) ? s.players.filter(function(p){ return typeof p === 'string'; }).slice(0, 150) : [];
      var key = JSON.stringify(list);
      if (key !== playersKey) { playersKey = key; players = list; renderPlayers(); }
      recent = Array.isArray(s.recent) ? s.recent.filter(function(v){ return v && ID.test(v.id) && typeof v.title === 'string'; }).slice(0, 10) : [];
      var song = function(p){ return typeof p.song === 'string' ? p.song.slice(0, 60) : ''; };
      var tl = Array.isArray(s.top) ? s.top.filter(function(p){ return p && typeof p.name === 'string' && typeof p.score === 'number'; }).slice(0, 3) : [];
      var db = s.duet && typeof s.duet.name === 'string' && typeof s.duet.score === 'number' ? { name: s.duet.name, score: s.duet.score, song: song(s.duet) } : null;
      setTop(tl.map(function(p){ return { name: p.name, score: p.score, song: song(p) }; }), db);
      var c = s.country || {};
      if (s.picks && c.code !== region) {
        region = c.code;
        setPicks(s.picks);
        $('findTitle').textContent = 'FIND A SONG' + (c.code ? ' · ' + (c.flag || '') + ' ' + (c.name || '') : '');
      }
      if (s.now) { $('nowSinger').textContent = s.now.singer + ' is singing'; $('nowSong').textContent = s.now.title; }
      else { $('nowSinger').textContent = 'Waiting for the next singer…'; $('nowSong').textContent = 'Add a song below!'; }
      queueNow = Array.isArray(s.queue) ? s.queue.filter(function(it){ return it && typeof it.singer === 'string' && typeof it.title === 'string'; }) : [];
      renderQueue();
    }).catch(function(){ failures = Math.min(failures + 1, 3); });
  }
  // Updates every ~4 s while the page is open (a little random, so a room full of phones doesn't
  // ask at the same instant), slower after errors, none while the phone is locked or in another app.
  var failures = 0, timer = null;
  function schedule(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      if (document.hidden) return;                    // picked up again by 'visibilitychange'
      refresh().then(schedule);
    }, Math.min(4000 * Math.pow(2, failures), 30000) + Math.random() * 800);
  }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh().then(schedule); });
  refresh().then(schedule);
})();
</script>
</body>
</html>
